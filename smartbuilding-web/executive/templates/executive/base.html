<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SBMS — Portail PDG{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --sb-primary: #0d47a1; --sb-accent: #1565c0; }
    body { background: #f4f6f9; min-height: 100vh; }
    .navbar-sb { background: linear-gradient(135deg, var(--sb-primary), var(--sb-accent)); }
    .card-kpi { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .kpi-value { font-size: 1.6rem; font-weight: 700; color: var(--sb-primary); }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
