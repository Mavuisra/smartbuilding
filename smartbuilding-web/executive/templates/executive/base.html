<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% csrf_token %}
  <title>{% block title %}Bloom Prosperity — Portail PDG{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --sb-bg: #f4fbf7;
      --sb-card: #ffffff;
      --sb-primary: #4cc26b;
      --sb-primary-700: #3d6b52;
      --sb-primary-soft: #f4fcf7;
      --sb-black: #0f172a;
      --sb-text: #0f172a;
      --sb-muted: #64748b;
      --sb-border: #dbe9e2;
      --sb-success: #16a34a;
      --sb-warning: #d97706;
      --sb-danger: #dc2626;
      --sb-radius: 14px;
      --sb-shadow: 0 8px 24px rgba(15, 23, 42, .06);
    }
    * { box-sizing: border-box; }
    body {
      background: var(--sb-bg);
      color: var(--sb-text);
      min-height: 100vh;
      margin: 0;
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .app-shell {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }
    .app-main {
      flex: 1;
      min-width: 0;
    }
    .navbar-sb {
      background: #1b3d3b;
      box-shadow: 0 8px 24px rgba(27, 61, 59, .25);
    }
    .sb-card {
      border: 1px solid var(--sb-border);
      background: var(--sb-card);
      border-radius: var(--sb-radius);
      box-shadow: var(--sb-shadow);
    }
    .sb-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }
    .sb-card-title {
      margin: 0;
      font-size: .95rem;
      font-weight: 700;
      color: var(--sb-muted);
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .kpi-value { font-size: 1.6rem; font-weight: 800; color: var(--sb-primary); }
    .kpi-delta { font-size: .8rem; color: var(--sb-muted); }
    .sb-pill {
      border-radius: 999px;
      padding: .15rem .6rem;
      font-size: .75rem;
      font-weight: 600;
      border: 1px solid var(--sb-border);
      background: #fff;
    }
    .sb-table thead th {
      border-bottom: 1px solid var(--sb-border);
      color: var(--sb-muted);
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .sb-table td {
      vertical-align: middle;
      border-color: #eef2f7;
    }
    .sb-sidebar {
      width: 250px;
      background: #1b3d3b;
      color: #f8fafc;
      padding: 18px 14px;
      border-right: 1px solid rgba(255,255,255,.08);
      overflow-y: auto;
    }
    .sb-sidebar .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: .02em;
    }
    .sb-sidebar .brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #4cc26b;
      color: #fff;
      font-weight: 800;
    }
    .sb-nav-group-title {
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #bbf7d0;
      margin: 16px 10px 8px;
    }
    .sb-nav-link {
      display: block;
      color: #f8fafc;
      text-decoration: none;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: .9rem;
      margin-bottom: 4px;
    }
    .sb-nav-link:hover { background: rgba(255,255,255,.18); color: #fff; }
    .sb-nav-link.active { background: rgba(76,194,107,.35); color: #fff; font-weight: 600; }
    .sb-nav-children { margin: 0 0 6px 10px; padding-left: 8px; border-left: 2px solid rgba(76,194,107,.4); }
    .sb-nav-child {
      display: block;
      color: #d1fae5;
      text-decoration: none;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: .82rem;
      margin-bottom: 2px;
    }
    .sb-nav-child:hover { background: rgba(255,255,255,.12); color: #fff; }
    .sb-nav-child.active { background: rgba(76,194,107,.45); color: #fff; font-weight: 600; }
    .text-info-emphasis { color: #dcfce7 !important; }
    .btn-primary,
    .btn-success {
      --bs-btn-bg: #4cc26b;
      --bs-btn-border-color: #4cc26b;
      --bs-btn-hover-bg: #3db85c;
      --bs-btn-hover-border-color: #3db85c;
      --bs-btn-active-bg: #35a652;
      --bs-btn-active-border-color: #35a652;
      color: #fff;
      font-weight: 700;
    }
    .btn-outline-secondary {
      --bs-btn-color: #0f172a;
      --bs-btn-border-color: #1b3d3b;
      --bs-btn-hover-bg: #0f172a;
      --bs-btn-hover-border-color: #0f172a;
      --bs-btn-hover-color: #fff;
    }
    .sb-topbar {
      background: #fff;
      border-bottom: 1px solid var(--sb-border);
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .sb-topbar-search {
      border: 1px solid var(--sb-border);
      border-radius: 10px;
      padding: 7px 10px;
      min-width: 320px;
      color: var(--sb-muted);
      font-size: .9rem;
    }
    .sb-page-wrap {
      padding: 18px 20px 30px;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
