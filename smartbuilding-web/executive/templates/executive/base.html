<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SBMS — Portail PDG{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --sb-bg: #f5f7fb;
      --sb-card: #ffffff;
      --sb-primary: #2a5bd7;
      --sb-primary-700: #1f49b5;
      --sb-text: #0f172a;
      --sb-muted: #64748b;
      --sb-border: #e2e8f0;
      --sb-success: #16a34a;
      --sb-warning: #d97706;
      --sb-danger: #dc2626;
      --sb-radius: 14px;
      --sb-shadow: 0 8px 24px rgba(15, 23, 42, .06);
    }
    * { box-sizing: border-box; }
    body {
      background: linear-gradient(180deg, #eef3ff 0%, var(--sb-bg) 30%);
      color: var(--sb-text);
      min-height: 100vh;
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .navbar-sb {
      background: linear-gradient(135deg, #1e3a8a 0%, #2a5bd7 55%, #3b82f6 100%);
      box-shadow: 0 8px 24px rgba(30, 58, 138, .25);
    }
    .sb-card {
      border: 1px solid var(--sb-border);
      background: var(--sb-card);
      border-radius: var(--sb-radius);
      box-shadow: var(--sb-shadow);
    }
    .sb-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }
    .sb-card-title {
      margin: 0;
      font-size: .95rem;
      font-weight: 700;
      color: var(--sb-muted);
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .kpi-value { font-size: 1.6rem; font-weight: 800; color: var(--sb-primary); }
    .kpi-delta { font-size: .8rem; color: var(--sb-muted); }
    .sb-pill {
      border-radius: 999px;
      padding: .15rem .6rem;
      font-size: .75rem;
      font-weight: 600;
      border: 1px solid var(--sb-border);
      background: #fff;
    }
    .sb-table thead th {
      border-bottom: 1px solid var(--sb-border);
      color: var(--sb-muted);
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .sb-table td {
      vertical-align: middle;
      border-color: #eef2f7;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
