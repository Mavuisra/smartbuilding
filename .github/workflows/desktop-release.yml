name: Desktop Release

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DESKTOP_API_BASE_URL: ${{ secrets.DESKTOP_API_BASE_URL }}
      DESKTOP_API_BASE_URL_VAR: ${{ vars.DESKTOP_API_BASE_URL }}
      DEFAULT_DESKTOP_API_BASE_URL: https://sbms.lasaveur.store/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $version = "1.0.$env:GITHUB_RUN_NUMBER"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish desktop (win-x64, self-contained)
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $outDir = "${{ github.workspace }}\artifacts\publish"
          $zipOut = "${{ github.workspace }}\artifacts"
          $zipName = "smartbuilding-desktop-win-x64-v$version.zip"

          if (Test-Path $outDir) { Remove-Item $outDir -Recurse -Force }
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          dotnet publish "SmartBuilding.Desktop.WPF\SmartBuilding.Desktop.WPF.csproj" `
            -c Release -r win-x64 --self-contained true `
            -p:Version=$version `
            -p:PublishTrimmed=false `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o $outDir

          if (Test-Path (Join-Path $zipOut $zipName)) { Remove-Item (Join-Path $zipOut $zipName) -Force }

          Get-ChildItem $outDir -Include *.db,*.db-wal,*.db-shm -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          # On zippe le dossier de publication. Le code d’application gère un éventuel dossier enveloppe.
          Compress-Archive -Path (Join-Path $outDir '*') -DestinationPath (Join-Path $zipOut $zipName) -Force

      - name: Inject production API URL in appsettings
        shell: pwsh
        run: |
          $outDir = "${{ github.workspace }}\artifacts\publish"
          $settingsPath = Join-Path $outDir "appsettings.json"
          if (!(Test-Path $settingsPath)) {
            throw "Fichier appsettings.json introuvable dans le package publié."
          }

          $json = Get-Content $settingsPath -Raw | ConvertFrom-Json
          $baseUrl = $env:DESKTOP_API_BASE_URL
          if ([string]::IsNullOrWhiteSpace($baseUrl)) {
            $baseUrl = $env:DESKTOP_API_BASE_URL_VAR
          }
          if ([string]::IsNullOrWhiteSpace($baseUrl) -and $null -ne $json.Api -and $null -ne $json.Api.BaseUrl) {
            $candidate = "$($json.Api.BaseUrl)".Trim()
            if ($candidate -and $candidate -notmatch "localhost|127\.0\.0\.1") {
              $baseUrl = $candidate
            }
          }
          if ([string]::IsNullOrWhiteSpace($baseUrl)) {
            $baseUrl = $env:DEFAULT_DESKTOP_API_BASE_URL
            Write-Host "Avertissement: DESKTOP_API_BASE_URL non défini, fallback appliqué: $baseUrl"
          }

          $baseUrl = $baseUrl.Trim()
          if (-not $baseUrl.EndsWith("/")) { $baseUrl = "$baseUrl/" }

          if ($null -eq $json.Api) {
            $json | Add-Member -MemberType NoteProperty -Name "Api" -Value ([PSCustomObject]@{})
          }
          $json.Api.BaseUrl = $baseUrl

          $json | ConvertTo-Json -Depth 20 | Set-Content $settingsPath -Encoding UTF8
          Write-Host "API de production injectée: $baseUrl"

      - name: Repackage desktop artifact after config injection
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $outDir = "${{ github.workspace }}\artifacts\publish"
          $zipOut = "${{ github.workspace }}\artifacts"
          $zipName = "smartbuilding-desktop-win-x64-v$version.zip"

          if (Test-Path (Join-Path $zipOut $zipName)) {
            Remove-Item (Join-Path $zipOut $zipName) -Force
          }
          Get-ChildItem $outDir -Include *.db,*.db-wal,*.db-shm -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $outDir '*') -DestinationPath (Join-Path $zipOut $zipName) -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          files: artifacts/smartbuilding-desktop-win-x64-v${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true

